# Repository-level tooling configuration.
#
# The Python code lives in three installable packages (apps/api, apps/worker and
# the two services). This file only carries settings that must be shared by all
# of them, so that `pytest`, `ruff` and `black` behave identically whether they
# are run from the repository root or from inside a package.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "services/image-processing/tests",
  "services/timelapse-renderer/tests",
  "apps/api/tests",
  "apps/worker/tests",
]
# importlib keeps same-named test modules in different packages from colliding.
addopts = "-q --import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: tests that render video or process large images"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "node_modules", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is enforced by the formatter
  "B008",    # FastAPI dependencies are function calls in defaults by design
  "RUF012",  # mutable class attributes are fine on dataclass-free config objects
  "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "SIM117"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "/(\\.venv|node_modules|alembic/versions)/"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
exclude = "(\\.venv|node_modules|alembic)"
