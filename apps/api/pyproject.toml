[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artrestore-api"
version = "0.1.0"
description = "ArtRestore Studio HTTP API."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0.28",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "celery>=5.3",
  "boto3>=1.34",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "artrestore-imaging",
  "artrestore-timelapse",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.3",
  "black>=24.2",
  "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
