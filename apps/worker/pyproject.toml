[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artrestore-worker"
version = "0.1.0"
description = "ArtRestore Studio background worker (Celery)."
requires-python = ">=3.11"
dependencies = [
  "celery>=5.3",
  "redis>=5.0",
  "artrestore-api",
  "artrestore-imaging",
  "artrestore-timelapse",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.3", "black>=24.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
