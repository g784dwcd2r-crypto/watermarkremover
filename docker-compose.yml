# ---------------------------------------------------------------------------
# ArtRestore Studio - local development stack.
#
#   cp .env.example .env
#   docker compose up --build
#
# Then: web on http://localhost:3000, API docs on http://localhost:8000/docs,
# and the MinIO console on http://localhost:9001.
#
# This file is for development. See docs/architecture/deployment.md before
# running any of it in production.
# ---------------------------------------------------------------------------
name: artrestore

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artrestore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artrestore}
      POSTGRES_DB: ${POSTGRES_DB:-artrestore}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artrestore}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ARS_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${ARS_S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create the bucket so the API does not have to on every start.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${ARS_S3_ACCESS_KEY_ID:-minioadmin} ${ARS_S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${ARS_S3_BUCKET:-artrestore} &&
      mc anonymous set none local/${ARS_S3_BUCKET:-artrestore} &&
      echo 'bucket ready'
      "

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
      target: api
    image: artrestore-api:latest
    env_file: [.env]
    environment:
      ARS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-artrestore}:${POSTGRES_PASSWORD:-artrestore}@postgres:5432/${POSTGRES_DB:-artrestore}
      ARS_REDIS_URL: redis://redis:6379/0
      ARS_CELERY_BROKER_URL: redis://redis:6379/1
      ARS_CELERY_RESULT_BACKEND: redis://redis:6379/2
      ARS_S3_ENDPOINT_URL: http://minio:9000
      ARS_PUBLIC_API_URL: http://localhost:8000
      ARS_PUBLIC_WEB_URL: http://localhost:3000
      ARS_CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports:
      - "8000:8000"
    # Migrations run before the API starts, so a fresh volume is usable.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn artrestore_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
      args:
        BASE_IMAGE: artrestore-api:latest
    image: artrestore-worker:latest
    env_file: [.env]
    environment:
      ARS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-artrestore}:${POSTGRES_PASSWORD:-artrestore}@postgres:5432/${POSTGRES_DB:-artrestore}
      ARS_REDIS_URL: redis://redis:6379/0
      ARS_CELERY_BROKER_URL: redis://redis:6379/1
      ARS_CELERY_RESULT_BACKEND: redis://redis:6379/2
      ARS_S3_ENDPOINT_URL: http://minio:9000
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }

  # Beat drives the retention sweep. Exactly one replica, ever.
  beat:
    image: artrestore-worker:latest
    env_file: [.env]
    environment:
      ARS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-artrestore}:${POSTGRES_PASSWORD:-artrestore}@postgres:5432/${POSTGRES_DB:-artrestore}
      ARS_CELERY_BROKER_URL: redis://redis:6379/1
      ARS_CELERY_RESULT_BACKEND: redis://redis:6379/2
      ARS_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      worker: { condition: service_started }
    command: ["celery", "-A", "artrestore_worker.celery_app:app", "beat", "--loglevel=info"]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: artrestore-web:latest
    depends_on:
      api: { condition: service_started }
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
